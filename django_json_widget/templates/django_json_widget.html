<div {% if widget.is_invalid %}data-jsoneditor-invalid="true"{% endif %} data-jsoneditor-options="{{ widget.options }}" {% if not widget.has_style %}style="height:{{widget.height|default:'500px'}};width:{{widget.width|default:'90%'}};display:inline-block;"{% endif %}{% include "django/forms/widgets/attrs.html" %}></div>

<textarea id="{{widget.attrs.id}}_textarea" name="{{ widget.name }}" style="display: none"></textarea>

{{ widget.value|json_script:script_id }}
