name: JavaScript Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  inline-editor:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Test inline editor initialization
      run: node --test tests/test_inline_editor.js
