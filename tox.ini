[tox]
envlist =
    django52-py{311,312,313}
    wagtail72-django52-py312

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}/django_json_widget
    DJANGO_SETTINGS_MODULE=tests.settings
    wagtail72: DJANGO_SETTINGS_MODULE=tests.wagtail_settings
commands = coverage run --source django_json_widget manage.py test -v 1
deps =
    -r{toxinidir}/requirements_test.txt
    django52: django~=5.2.0
    wagtail72: wagtail~=7.2.0
